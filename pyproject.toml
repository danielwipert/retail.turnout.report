[project]
name = "turnout"
version = "0.1.0"
description = "The Turnout Report: are customers showing up, and is the business holding up?"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["turnout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
