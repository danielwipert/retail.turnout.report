name: fetch filings

# Run from GitHub: Actions tab → "fetch filings" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers, space-separated (leave blank for the 3 test chains; type ALL for every chain)"
        required: false
        default: "TXRH WMT FND"
      quarters:
        description: "How many quarters back"
        required: false
        default: "8"
      force:
        description: "Re-download even if already saved"
        type: boolean
        default: false

permissions:
  contents: write  # lets the run save looked-up CIKs back to data/universe.json

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Check setup
        run: |
          for s in SEC_USER_AGENT R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!s}" ]; then echo "::error::Missing repository secret: $s"; exit 1; fi
          done

      - name: Get saved filings from R2
        run: python -m turnout storage pull

      - name: Fetch
        run: |
          TICKERS="${{ inputs.tickers }}"
          ARGS="--quarters ${{ inputs.quarters }}"
          if [ "$TICKERS" = "ALL" ]; then ARGS="$ARGS --all";
          elif [ -n "$TICKERS" ]; then ARGS="$ARGS --tickers $TICKERS"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m turnout fetch $ARGS

      - name: Save filings to R2
        if: always()
        run: python -m turnout storage push

      - name: Summary
        if: always()
        run: |
          python -m turnout status | tee status.txt
          {
            echo "## Saved filings"
            echo '```'
            cat status.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit CIK lookups
        run: |
          if ! git diff --quiet data/universe.json; then
            git config user.name "turnout-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/universe.json
            git commit -m "Save CIKs looked up by fetch run"
            git push
          fi
