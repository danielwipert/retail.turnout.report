name: model bake-off

# Compares LLMs on the same saved quarters (decision P2-2).
on:
  workflow_dispatch:
    inputs:
      models:
        description: "OpenRouter model ids, space-separated (blank = list in data/settings.json)"
        required: false
        default: ""
      tickers:
        description: "Tickers (blank = TXRH WMT FND)"
        required: false
        default: ""
      quarters:
        description: "Latest N quarters per chain (blank = all saved)"
        required: false
        default: ""
      force:
        description: "Redo quarters already run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Check setup
        run: |
          for s in OPENROUTER_API_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!s}" ]; then echo "::error::Missing repository secret: $s"; exit 1; fi
          done

      - name: Get saved filings from R2
        run: python -m turnout storage pull ${{ inputs.tickers && format('--tickers {0}', inputs.tickers) || '--tickers TXRH WMT FND' }}

      - name: Run bake-off
        timeout-minutes: 60
        run: |
          ARGS=""
          if [ -n "${{ inputs.models }}" ]; then ARGS="$ARGS --models ${{ inputs.models }}"; fi
          if [ -n "${{ inputs.tickers }}" ]; then ARGS="$ARGS --tickers ${{ inputs.tickers }}"; fi
          if [ -n "${{ inputs.quarters }}" ]; then ARGS="$ARGS --quarters ${{ inputs.quarters }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m turnout bakeoff $ARGS

      - name: Summary
        if: always()
        run: cat data/bakeoff/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit report and per-model results
        if: always()
        run: |
          git config user.name "turnout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bakeoff || true
          if ! git diff --cached --quiet; then
            git commit -m "Bake-off results"
            git pull --rebase -q && git push
          fi
